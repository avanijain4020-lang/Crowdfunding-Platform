<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CrowdFund</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* EXACT BACKGROUND COLOR FROM IMAGE (#182c34) */
    body {
      background-color: #182c34;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main Container Split Layout */
    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 850px;
      display: flex;
      overflow: hidden;
      min-height: 480px;
    }

    /* Left Side: Form Section */
    .form-section {
      flex: 1;
      padding: 45px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-header h2 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .form-header p {
      font-size: 14px;
      color: #666666;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      background: #fafafa;
    }

    .form-group input:focus {
      border-color: #0b5e43;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(11, 94, 67, 0.15);
    }

    /* Primary Submit Button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #0056b3;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      text-align: center;
      color: #0b5e43;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Right Side: Dark Green Theme Banner */
    .banner-section {
      flex: 1;
      background: #0b5e43;
      color: #ffffff;
      padding: 45px 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .banner-section h1 {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .banner-section p {
      font-size: 14px;
      color: #e0f2fe;
      line-height: 1.5;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .btn-outline {
      padding: 10px 28px;
      border: 1.5px solid #ffffff;
      border-radius: 20px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .btn-outline:hover {
      background: #ffffff;
      color: #0b5e43;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .auth-card {
        flex-direction: column;
      }
      .banner-section {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    
    <!-- LEFT SIDE: Form Inputs -->
    <div class="form-section">
      
      <!-- STEP 1: Send OTP -->
      <div id="step-send-otp">
        <div class="form-header">
          <h2>Forgot Password 🔒</h2>
          <p>Log in to manage your campaigns after verification.</p>
        </div>

        <form id="form-send-otp">
          <div class="form-group">
            <label for="reset-email">Email Address</label>
            <input type="email" id="reset-email" placeholder="Enter your email" required autocomplete="off">
          </div>
          <button type="submit" class="btn-submit">Send OTP</button>
        </form>
      </div>

      <!-- STEP 2: Verify OTP & Reset Password -->
      <div id="step-verify-otp" class="hidden">
        <div class="form-header">
          <h2>Reset Password 🔑</h2>
          <p>Enter the 6-digit OTP sent to your email.</p>
        </div>

        <form id="form-verify-otp">
          <div class="form-group">
            <label for="otp-input">6-Digit OTP</label>
            <input type="text" id="otp-input" placeholder="Enter 6-digit OTP" maxlength="6" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" placeholder="Enter new password" required>
          </div>
          <button type="submit" class="btn-submit">Reset Password</button>
        </form>
      </div>

      <div style="text-align: center;">
        <a href="auth.html" class="back-link">← Back to Sign In</a>
      </div>

    </div>

    <!-- RIGHT SIDE: Dark Green Banner -->
    <div class="banner-section">
      <h1>Account Recovery!</h1>
      <p>Don't worry, we'll help you get back to bringing your creative ideas to life in no time.</p>
      <a href="auth.html" class="btn-outline">Sign In</a>
    </div>

  </div>

  <script>
    const API_BASE = "http://localhost:5000/api";
    let userEmail = "";

    // 1. Send OTP Request
    document.getElementById('form-send-otp').addEventListener('submit', async (e) => {
      e.preventDefault();
      userEmail = document.getElementById('reset-email').value;

      try {
        const res = await fetch(`${API_BASE}/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail })
        });
        const data = await res.json();

        if (res.ok) {
          alert(data.message);
          document.getElementById('step-send-otp').classList.add('hidden');
          document.getElementById('step-verify-otp').classList.remove('hidden');
        } else {
          alert(data.message || "Failed to send OTP.");
        }
      } catch (err) {
        alert("Server error. Please check if backend is running.");
      }
    });

    // 2. Verify OTP & Reset Password
    document.getElementById('form-verify-otp').addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('otp-input').value;
      const newPassword = document.getElementById('new-password').value;

      try {
        const res = await fetch(`${API_BASE}/verify-otp-reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, otp, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          alert(data.message);
          window.location.href = 'auth.html';
        } else {
          alert(data.message || "Invalid OTP or request failed.");
        }
      } catch (err) {
        alert("Server error while resetting password.");
      }
    });
  </script>
</body>
</html>
