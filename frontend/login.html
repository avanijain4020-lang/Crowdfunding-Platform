<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CrowdFund</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚀 CrowdFund</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <div class="container" style="max-width: 450px; margin-top: 50px;">
        <div class="campaign-card">
            <h2 style="text-align: center;">Welcome Back</h2>
            <form onsubmit="handleLogin(event)">
                <div style="margin-bottom: 15px;">
                    <label><strong>Email Address:</strong></label>
                    <input type="email" id="login-email" required style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label><strong>Password:</strong></label>
                    <input type="password" id="login-password" required style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;">
                </div>
                <button type="submit" style="width: 100%; background-color: #2196F3; padding: 12px;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    alert(data.message);
                    // Save User Session to Browser Storage
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert("Server error during login.");
            }
        }
    </script>
</body>
</html>
